// integrità + cifratura (Web Crypto)
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64e=a=>{let s='';for(const c of new Uint8Array(a))s+=String.fromCharCode(c);return btoa(s)},b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64s=t=>btoa(unescape(encodeURIComponent(t))),deb=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
async function ckey(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(pw,salt,250000),new TextEncoder().encode(txt));return{app:'dieta-crea',format:2,enc:{alg:'AES-GCM',kdf:'PBKDF2-SHA256',iter:250000,salt:b64e(salt),iv:b64e(iv)},data:b64e(ct)}}
async function dec(o,pw){const e=o.enc,pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},await ckey(pw,b64d(e.salt),e.iter),b64d(o.data));return JSON.parse(new TextDecoder().decode(pt))}
async function mkBackup(){const st=JSON.stringify(S);return{app:'dieta-crea',format:2,appVersion:APPV,exported:new Date().toISOString(),sha256:await sha(st),state:JSON.parse(st)}}
async function applyBackup(p,src){if(p.sha256&&p.sha256!==await sha(JSON.stringify(p.state))&&!confirm('Il controllo di integrità non corrisponde: il file potrebbe essere stato modificato. Continuare?'))return false;
const st=normS(p.state||p);if(!Array.isArray(st.meals))throw new Error('formato');const days=Object.values(st.plan).filter(d=>Object.values(d).some(a=>a.length)).length;
if(!confirm(`${src}: ${st.meals.length} pasti, ${days} giorni pianificati, ${st.fav.length} preferiti. Sostituire i dati attuali? Prima verrà salvata una copia di sicurezza.`))return false;
await snapAdd('Prima del ripristino');S=st;S.seed=1;S.onb=1;save();render();toast('Dati ripristinati');return true}

const GH=async(m,p,b)=>{const r=await fetch('https://api.github.com'+p,{method:m,headers:{Authorization:'Bearer '+CFG.t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:b?JSON.stringify(b):undefined});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()};
const GP=()=>`/repos/${CFG.o}/${CFG.r}/contents/dieta-crea/backup.json`;
const gerr=e=>e.status===401?'Token non valido o scaduto.':e.status===403?'Permessi insufficienti (serve Contents: Read and write).':e.status===404?'Repository non trovato o token senza accesso.':e.status===409||e.status===422?'Conflitto: riprova.':e.message||'Errore di rete.';
async function ghPush(msg,silent){let sha0,rts=0;try{const r=await GH('GET',GP());sha0=r.sha;try{rts=(JSON.parse(deb(r.content)).state||{}).ts||0}catch(e){}}catch(e){if(e.status!==404)throw e}
if(rts>(CFG.syncTs||0)&&rts!==S.ts){if(silent)throw new Error('Versione più recente su GitHub: apri Dati e backup.');if(!confirm('Su GitHub c’è una versione più recente di questa. Sovrascriverla?'))return false}

<div class="card ex"><details data-d="calc"${V.dopen.calc?' open':''} style="border:0"><summary>Come sono calcolati</summary><p><small>Metabolismo basale: equazione di Mifflin–St Jeor. Attività = 1,2 + 0,06 × allenamenti/sett. (+0,1 se lavori in piedi), max 1,9. Definizione: −15% (deficit moderato, tipicamente −0,3/−0,7% del peso a settimana, per limitare la perdita di massa magra); ricomposizione −5%; lean bulk +10%. Proteine 2,2 g/kg in definizione, 2,0 in ricomposizione, 1,8 negli altri casi (range 1,6–2,4 g/kg per chi si allena con i pesi, ISSN/Morton). Grassi: il maggiore tra 0,8 g/kg e 25% delle kcal. Carboidrati: il resto (3,75 kcal/g come nelle tabelle CREA). Fibra: 14 g/1000 kcal, minimo 25 g. Riferimenti per i micronutrienti: LARN adulti (indicativi). Stime generali: non sostituiscono il parere di un medico o di un dietista, soprattutto in presenza di patologie.</small></p></details></div>`}
function userH(){const u=S.user,fr=(l,inner)=>`<label class="row fr"><span>${l}</span>${inner}</label>`,
num=(k,l,un,st)=>fr(l,`<span class="fv"><input type="number" inputmode="decimal" data-u="${k}" value="${u[k]}" step="${st||1}"><em>${un}</em></span>`),
sel=(k,o)=>`<select data-u="${k}">${o.map(([v,l])=>`<option value="${v}"${String(u[k])===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
return `<h1>Utente</h1><div class="grp">${fr('Sesso',sel('sex',[['M','Uomo'],['F','Donna']]))}${num('age','Età','anni')}${num('h','Altezza','cm')}${num('w','Peso','kg',.1)}${fr('Lavoro',sel('job',[[0,'Sedentario'],[.1,'In piedi / in movimento']]))}${num('sess','Allenamenti','a sett.')}${fr('Obiettivo',sel('goal',[['cut','Definizione'],['recomp','Ricomposizione'],['maint','Mantenimento'],['bulk','Massa magra']]))}</div>
<div id="ures">${userRes()}</div>
<h3>Target personalizzati</h3><div class="grp">${[['okcal','Calorie','kcal'],['oP','Proteine','g'],['oF','Grassi','g'],['oC','Carboidrati','g']].map(([k,l,un])=>fr(l,`<span class="fv"><input type="number" inputmode="decimal" data-u="${k}" placeholder="auto" value="${u[k]||''}"><em>${un}</em></span>`)).join('')}</div><p class="hint">Lascia vuoto per usare il calcolo automatico.</p>
<h3>Preferenze</h3><div class="grp"><label class="row ic fr">${tile('scale','tl-g')}<span class="rc"><b>Pesi al lordo degli scarti</b><small>I grammi nei pasti sono “come acquistato”.</small></span><input type="checkbox" class="sw" id="gr"${S.gross?' checked':''} aria-label="Pesi al lordo degli scarti"></label></div>
<h3>Dati e app</h3><div class="grp"><button class="row ic" data-act="bk">${tile('cloud','tl-b')}<span class="rc"><b>Dati e backup</b><small>${bdue()?'Backup consigliato':'Ultimo backup: '+fdt(Math.max(S.lastBackup||0,CFG.last||0))}</small></span><span class="chev">›</span></button><button class="row ic" data-act="inf">${tile('info','tl-k')}<span class="rc"><b>Informazioni e aggiornamenti</b><small>Beta ${APPV}</small></span><span class="chev">›</span></button></div>`}
const buy=(r,g)=>S.gross?g:g/(r[4]>.05?r[4]:1)*r[6],pk=r=>S.prices[r[0]]??r.pp;
const qf=q=>q>=1000?f1(q/1000,2)+' kg':f1(q,0)+' g';
function spesaH(){const m=new Map(),sel=V.sd;
DY.forEach((_,d)=>SL.forEach((_,s)=>P(d,s).forEach(e=>{const ml=S.meals.find(x=>x.id===e.m);if(!ml)return;ml.items.forEach(it=>{const r=FM.get(it.c);if(!r)return;let o=m.get(it.c);if(!o)m.set(it.c,o={r,d:new Array(7).fill(0)});o.d[d]+=buy(r,it.g*e.k)})})));
const L=[...m.values()].map(o=>({...o,q:sel.reduce((a,d)=>a+o.d[d],0)})).filter(o=>o.q>0),cost=o=>o.q/1000*pk(o.r);V.L=L;let T=0,R=0;L.forEach(o=>{T+=cost(o);if(!S.got[o.r[0]])R+=cost(o)});
let h=`<h1>Spesa</h1><div class="dch">${DY.map((n,i)=>`<button class="${sel.includes(i)?'on':''}" data-act="sd" data-d="${i}" aria-pressed="${sel.includes(i)}">${n}</button>`).join('')}</div><div class="fch"><button data-act="sdp" data-p="a">Tutta la settimana</button><button data-act="sdp" data-p="b">Lun–Mer</button><button data-act="sdp" data-p="c">Gio–Dom</button><button data-act="shl">${svg('share')}Condividi</button><button data-act="clrgot">Azzera spunte</button></div>`;
if(!L.length)return h+empty('bag','Lista vuota','Aggiungi pasti nella scheda Settimana, poi scegli i giorni da includere.');
const n=L.length,dn=L.filter(o=>S.got[o.r[0]]).length;
h+=`<div class="card"><div class="kc">${f1(T,2)}<small>€ stimati</small></div><div class="bb" style="margin:12px 0 7px"><i style="width:${dn/n*100}%"></i></div><small>${dn} di ${n} prodotti nel carrello · ancora ${f1(R,2)} €</small></div>`;
for(const c of CATS){const l=L.filter(o=>o.r[2]===c);if(!l.length)continue;
h+=`<div class="gh"><span>${esc(c)}</span><span>${f1(l.reduce((a,o)=>a+cost(o),0),2)} €</span></div><div class="grp">`+l.sort((a,b)=>a.r[1].localeCompare(b.r[1],'it')).map(o=>{const id=o.r[0],g=!!S.got[id];
return `<div class="row sp${g?' got':''}"><button class="ck${g?' on':''}" data-act="got" data-c="${id}" aria-label="Segna come comprato" aria-pressed="${g}"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></svg></button><div class="rc" data-act="sp" data-c="${id}"><b>${esc(o.r[1])}</b><small>${o.d.map((q,d)=>q>0?`<span class="${sel.includes(d)?'on':'off'}">${DY[d]} ${f1(q,0)} g</span>`:'').filter(Boolean).join(' · ')}</small></div><div class="kk" data-act="sp" data-c="${id}"><b>${qf(o.q)}</b><small>${f1(cost(o),2)} €</small></div><span class="chev" data-act="sp" data-c="${id}">›</span></div>`}).join('')+'</div>'}
return h+'<p class="hint">Quantità da comprare: cotto convertito in crudo o secco, scarti inclusi. Tocca un prodotto per correggere il prezzo.</p>'}
function spH(c){const r=FM.get(c),o=(V.L||[]).find(x=>x.r[0]===c)||{d:new Array(7).fill(0),q:0};
return `<div class="sh bar"><span></span><button data-act="closeall"><b>Fine</b></button></div><h2>${esc(r[1])}</h2><p class="sub">${esc(r[2])}</p>
<h3>Quantità da comprare</h3><div class="grp">${o.d.map((q,d)=>q>0?`<div class="row kv"><span>${DY[d]}</span><b>${qf(q)}</b></div>`:'').join('')}<div class="row kv"><span style="color:var(--tx);font-weight:600">Totale (giorni scelti)</span><b style="color:var(--tx);font-weight:600">${qf(o.q)}</b></div></div>
<h3>Prezzo</h3><div class="grp"><label class="row fr"><span>Prezzo al kg</span><span class="fv"><input id="spr" type="number" inputmode="decimal" step="any" value="${+pk(r).toFixed(2)}" data-pc="${c}" aria-label="Prezzo al chilo"><em>€/kg</em></span></label><div class="row kv"><span>Costo stimato</span><b id="spc">${f1(o.q/1000*pk(r),2)} €</b></div></div>${S.prices[c]!==undefined?`<div class="btns"><button data-act="prreset" data-c="${c}">Ripristina il prezzo stimato</button></div>`:''}`}
const TT={foods:'Alimenti',meals:'Pasti',week:'Settimana',shop:'Spesa',user:'Utente'};
function render(){const y=scrollY;document.querySelector('nav [data-t=user]').classList.toggle('due',bdue());$('#nt').textContent=TT[V.tab];
document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.t===V.tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
if(V.edit&&!M())V.edit=null;
$('#app').innerHTML=V.tab==='foods'?foodsH():V.tab==='meals'?(V.edit?editH():mealsH()):V.tab==='week'?weekH():V.tab==='user'?userH():spesaH();bindSw($('#app'));const mn=$('#mn');if(mn){mn.style.height='auto';mn.style.height=mn.scrollHeight+'px'}if(y)scrollTo(0,y)}
const done=()=>{save();render()};
const nid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,c=d.c;
switch(b.dataset.act){
case'fsh':V.sk='f';openSheet(fsH());break;
case'sort':V.sort=d.k;tap();openSheet(fsH(),1);refresh();break;
case'ft2':{tap();const k=V.ft.indexOf(d.f);k<0?V.ft.push(d.f):V.ft.splice(k,1);openSheet(fsH(),1);refresh();break}
case'fclr':V.ft=[];V.sort='';V.cat='';openSheet(fsH(),1);refresh();break;
case'scl':{const i=b.closest('.srch').querySelector('input');i.value='';i.blur();i.dispatchEvent(new Event('input',{bubbles:true}));break}
case'got':{tap();S.got[c]?delete S.got[c]:S.got[c]=true;done();break}
case'sp':V.sk='sp';openSheet(spH(c));break;
case'prreset':delete S.prices[c];save();openSheet(spH(c),1);break;
case'mtag':{const m=M();m.t=m.t===d.t?'':d.t;tap();done();break}
case'fb':{tap();V.fb=d.b;const sg=document.querySelector('#sheet .seg');if(sg)sg.style.setProperty('--i',d.b==='p'?1:0);setTimeout(()=>openSheet(detailH(V.dc),1),220);break}
case'bk':V.sk='b';openSheet(bkH());break;
case'bexp':bexp();break;
case'bshare':shareFile();break;
case'bdl':dlFile();break;
case'snaplist':snapListH().then(h=>openSheet(h));break;
case'snaprs':snaprs(+d.i);break;
case'glink':glink();break;case'gpush':gpush();break;case'glist':glist();break;case'grs':grs(d.sha);break;
case'gunlink':CFG={};saveCfg();openSheet(bkH(),1);break;
case'inf':V.sk='i';openSheet(infoH());relInfo();break;
case'chkupd':if(SWR)SWR.update().then(()=>toast('Controllo completato')).catch(()=>toast('Controllo non riuscito'));else toast('Aggiornamenti non disponibili qui');break;
case'tst':{const f=V.tfn;$('#tst').hidden=true;f&&f();break}
case'onb':S.onb=1;V.tab='user';closeSheet();done();scrollTo(0,0);break;
case'onb2':S.onb=1;closeSheet();save();break;
case'cpday':V.cp=[];openSheet(cpH());break;
case'cpd':{const k=V.cp.indexOf(+d.d);k<0?V.cp.push(+d.d):V.cp.splice(k,1);openSheet(cpH(),1);break}
case'cpdo':{withUndo('Giorno copiato');const src=JSON.stringify(S.plan[V.day]||{});V.cp.forEach(x=>S.plan[x]=JSON.parse(src));closeSheet();done();break}
case'clrday':withUndo('Giorno svuotato');delete S.plan[V.day];done();break;
case'shl':shl();break;
case'sd':{tap();const k=V.sd.indexOf(+d.d);k<0?V.sd.push(+d.d):V.sd.splice(k,1);render();break}
case'sdp':V.sd=d.p==='a'?[0,1,2,3,4,5,6]:d.p==='b'?[0,1,2]:[3,4,5,6];render();break;
case'clrgot':withUndo('Spunte azzerate');S.got={};done();break;
case'fav':{tap();const k=S.fav.indexOf(c);k<0?S.fav.push(c):S.fav.splice(k,1);save();if(V.sk==='d'&&!$('#sheet').hidden)openSheet(detailH(c),1);refresh();break}
case'ft':{tap();const k=V.ft.indexOf(d.f);k<0?V.ft.push(d.f):V.ft.splice(k,1);render();break}
case'pfav':V.pfav=!V.pfav;openPicker();break;
case'mt':V.mt=d.t;render();break;
case'tab':{tap();V.tab=d.t;V.edit=null;closeSheet();render();scrollTo(0,0);const a=$('#app');a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx');break}
case'food':V.sk='d';V.fb='100';V.dc=c;openSheet(detailH(c));break;
case'close':V.pick?openPicker():closeSheet();break;
case'closeall':V.pick=false;closeSheet();break;
case'pick':V.pick=true;openPicker();break;
case'addfood':M().items.push({c,g:FM.get(c)[3]});V.pick=false;closeSheet();done();break;
case'newmeal':{const m={id:nid(),name:FM.get(c)[1],items:[{c,g:FM.get(c)[3]}]};S.meals.push(m);V.tab='meals';V.edit=m.id;closeSheet();done();scrollTo(0,0);break}
case'nm':{const m={id:nid(),name:'Nuovo pasto',t:V.mt==='Tutti'?'':V.mt,items:[]};S.meals.push(m);V.edit=m.id;done();break}
case'editmeal':V.edit=d.id;render();scrollTo(0,0);break;
case'back':V.edit=null;render();break;
case'rmitem':withUndo('Alimento rimosso');M().items.splice(+d.i,1);done();break;
case'dupmeal':{const m=M(),n={id:nid(),name:m.name+' (copia)',items:m.items.map(x=>({...x}))};S.meals.push(n);V.edit=n.id;done();break}
case'delmeal':withUndo('Pasto eliminato');S.meals=S.meals.filter(m=>m.id!==V.edit);for(const dd in S.plan)for(const ss in S.plan[dd])S.plan[dd][ss]=S.plan[dd][ss].filter(x=>x.m!==V.edit);V.edit=null;done();break;
case'day':{tap();const sg=document.querySelector('.seg');if(sg)sg.style.setProperty('--i',d.d);V.day=+d.d;setTimeout(render,230);break}
case'addslot':V.slot=+d.s;openSheet(`<div class="sh bar"><span></span><button data-act="closeall">Annulla</button></div><h2>${SL[V.slot]}</h2><p class="sub">${['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'][V.day]}</p>`+(S.meals.length?'<div class="grp">'+[...S.meals].sort((a,b)=>(b.t===SLT[V.slot])-(a.t===SLT[V.slot])).map(m=>{const t=tot(m.items).t;return `<button class="row" data-act="choose" data-id="${m.id}"><span class="rc"><b>${esc(m.name)}</b><small>${m.t||'Senza categoria'}</small>${mac(t)}</span><span class="kk"><b>${f1(t[0],0)}</b><small>kcal</small></span></button>`}).join('')+'</div>':empty('plate','Nessun pasto','Crea un pasto dalla scheda Pasti, poi tornerai qui.')));break;
case'choose':P(V.day,V.slot).push({m:d.id,k:1});closeSheet();done();break;
case'kd':{tap();const e2=P(V.day,+d.s)[+d.j];e2.k=Math.max(.5,e2.k-.5);done();break}
case'ki':{tap();const e2=P(V.day,+d.s)[+d.j];e2.k+=.5;done();break}
case'rme':withUndo('Pasto rimosso');P(V.day,+d.s).splice(+d.j,1);done();break;
case'cp':{const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value)}catch(x){try{document.execCommand('copy')}catch(y){}}$('#msg').textContent='Copiato (se non funziona, tieni premuto e copia).';break}
case'imp':try{const j=JSON.parse($('#im').value);if(!Array.isArray(j.meals))throw 0;S={meals:j.meals,plan:j.plan||{},gross:!!j.gross};done()}catch(x){$('#msg').textContent='Backup non valido.'}break}});
function flt(t){if(t.id==='ms'){V.ms=t.value;$('#ml').innerHTML=mlist();return 1}
if(t.id==='q'||t.id==='cat'){V.q=$('#q').value;V.cat=$('#cat')?$('#cat').value:V.cat;const f=$('#fl');if(f)f.innerHTML=listH(V.q,V.cat,1);return 1}
if(t.id==='pq'){V.pq=t.value;$('#pl').innerHTML=listH(V.pq,V.pc);return 1}}
document.addEventListener('input',e=>{const t=e.target;
if(flt(t)){}
else if(t.id==='spr'){const c=t.dataset.pc,v=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);S.prices[c]=v;save();const o=(V.L||[]).find(x=>x.r[0]===c);$('#spc').textContent=f1((o?o.q:0)/1000*v,2)+' €'}
else if(t.id==='mn'){t.value=t.value.replace(/\n/g,' ');t.style.height='auto';t.style.height=t.scrollHeight+'px';M().name=t.value;save()}
else if(t.dataset.g!==undefined){M().items[+t.dataset.g].g=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);save();editLive(+t.dataset.g)}
else if(t.dataset.u&&t.type==='number'){S.user[t.dataset.u]=parseFloat(String(t.value).replace(',','.'))||0;save();$('#ures').innerHTML=userRes()}});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&flt(t))return;
if(t.id==='bimp'){const f=t.files[0];t.value='';if(f)bimp(f);return}
if(t.id==='gauto'){CFG.auto=t.checked;saveCfg();return}
if(t.dataset.got){S.got[t.dataset.got]=t.checked;done()}
else if(t.dataset.pr){S.prices[t.dataset.pr]=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);soft()}
else if(t.dataset.u){const k=t.dataset.u;S.user[k]=['sex','goal'].includes(k)?t.value:parseFloat(String(t.value).replace(',','.'))||0;t.type==='number'?save():done()}
else if(t.id==='mtag'){M().t=t.value;done()}
else if(t.dataset.g!==undefined){save()}
else if(t.id==='gr'){tap();S.gross=t.checked;done()}
else if(t.id==='mn')render()});
render();
addEventListener('scroll',()=>{$('#nb').style.setProperty('--p',Math.max(0,Math.min(1,(scrollY-14)/26)));const sb=document.querySelector('.sb');if(sb)sb.classList.toggle('stuck',sb.getBoundingClientRect().top<=parseFloat(getComputedStyle(sb).top)+1)},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.id==='mn'&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{SWR=r}).catch(()=>{}));navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('App aggiornata',['Ricarica',()=>location.reload()])})}
</script></body></html>
